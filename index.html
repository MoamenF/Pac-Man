<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pac-Man</title>
  <link rel="stylesheet" href="css/pacman.css">
</head>

<body onload="onInit()" onkeyup="movePacman(event)">
  <img class="logo-img" src="img/pacman-logo.png" alt="pacman-logo">
  <h2>Score: <span>0</span></h2>
  <div class="board-container"></div>

  <div class="res-pause">
    <button class="game-btn res-button" onclick="onNewGame()">Restart</button>
    <button class="game-btn mute-button" onclick="onMute(this)">Mute</button>
    <button class="game-btn pause-button" onclick="onPause(this)">Pause</button>
  </div>

  <div class="movement-buttons">
    <div>
      <button class="move-button" onclick="movePacman('ArrowUp')">↑</button>
    </div>

    <div>
      <button class="move-button" onclick="movePacman('ArrowLeft')">←</button>
      <button class="move-button" onclick="movePacman('ArrowDown')">↓</button>
      <button class="move-button" onclick="movePacman('ArrowRight')">→</button>
    </div>

  </div>
  <div hidden class="modal">
    <h1>GAME OVER!</h1>
    <div class="modal-buttons">
      <button onclick="onNewGame()">Play Again</button>
    </div>
  </div>


  <script src="js/utils.js"></script>
  <script src="js/game.js"></script>
  <script src="js/pacman.js"></script>
  <script src="js/ghost.js"></script>
</body>

</html>
